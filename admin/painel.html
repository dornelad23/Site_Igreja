<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="painel">
    <aside class="sidebar">
        <h2>IASD Admin</h2>

        <nav>
            <button class="ativo">Eventos</button>
            <button>Aulas</button>
            <button>Banner</button>
            <button id="logout">Sair</button>
        </nav>
    </aside>

    <main class="conteudo">
        <h1>Gerenciar Eventos</h1>

        <form id="form-evento" class="form-admin">
            <input type="hidden" id="evento-id">

            <input type="text" id="titulo" placeholder="Título do evento" required>
            <textarea id="descricao" placeholder="Descrição do evento" required></textarea>

            <input type="date" id="data" required>
            <input type="time" id="horario" required>

            <select id="tipo" required>
                <option value="">Selecione a categoria</option>
                <option value="Culto">Culto</option>
                <option value="Jovens">Jovens</option>
                <option value="Ação Social">Ação Social</option>
                <option value="Infantil">Infantil</option>
                <option value="Família">Família</option>
            </select>

            <div class="upload-area" id="upload-area">
    <input type="file" id="imagem" accept="image/*" hidden>

    <div class="upload-content" id="upload-content">
        <span>📷</span>
        <p>Arraste uma imagem aqui</p>
        <small>ou clique para selecionar</small>
    </div>

    <img id="preview-imagem" alt="Prévia da imagem">
</div>

            <button type="submit">Salvar Evento</button>
        </form>

        <h2>Eventos cadastrados</h2>

        <div id="lista-eventos-admin" class="lista-admin"></div>
    </main>
</div>

<script type="module" src="js/painel.js"></script>
</body>
</html>
